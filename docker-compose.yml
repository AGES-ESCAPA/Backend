# Ordem de subida:
# 1. postgres, minio e mailpit sobem em paralelo
# 2. minio-init aguarda o MinIO ficar saudável
# 3. minio-init cria o bucket e envia as capas
# 4. backend sobe após PostgreSQL e Mailpit saudáveis + seed do MinIO concluído
# 5. Flyway executa migrations/seeds

services:
  postgres:
    image: postgres:16-alpine
    container_name: escapadb
    restart: unless-stopped

    environment:
      POSTGRES_DB: escapa_db
      POSTGRES_USER: escapa
      POSTGRES_PASSWORD: escapa123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escapa -d escapa_db"]
      interval: 5s
      timeout: 5s
      retries: 10


  minio:
    build:
      context: ./minio-local
      dockerfile: Dockerfile
      args:
        MINIO_RELEASE: RELEASE.2025-09-07T16-13-09Z

    image: escapa-minio:local
    container_name: escapaminio
    restart: unless-stopped

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    environment:
      MINIO_ROOT_USER: escapa
      MINIO_ROOT_PASSWORD: escapa12345

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s


  minio-init:
    build:
      context: ./minio-seed
      dockerfile: Dockerfile
      args:
        MC_RELEASE: RELEASE.2025-08-13T08-35-41Z

    image: escapa-minio-init:local
    container_name: escapaminio-init
    restart: "no"

    depends_on:
      minio:
        condition: service_healthy

    environment:
      MINIO_HOST: http://minio:9000
      MINIO_ROOT_USER: escapa
      MINIO_ROOT_PASSWORD: escapa12345
      MINIO_BUCKET: escapa-media

    volumes:
      - ./minio-seed:/seed:ro

    entrypoint:
      - /bin/sh
      - /seed/init.sh


  # Servidor de e-mail falso (US-31): recebe o SMTP do backend e guarda as mensagens,
  # sem enviar nada de verdade. Caixa de entrada em http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31.0
    container_name: escapamailpit
    restart: unless-stopped

    ports:
      - "1025:1025"
      - "8025:8025"


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: escapabackend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

      minio-init:
        condition: service_completed_successfully

      # A imagem do Mailpit ja traz healthcheck (/mailpit readyz).
      mailpit:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/escapa_db
      SPRING_DATASOURCE_USERNAME: escapa
      SPRING_DATASOURCE_PASSWORD: escapa123

      SERVER_PORT: 8080

      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/seed

      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000

      APP_JWT_SECRET: ${APP_JWT_SECRET:-escapa-jwt-secret-key-development-minimum-256-bits-length}
      APP_JWT_EXPIRATION_MINUTES: ${APP_JWT_EXPIRATION_MINUTES:-60}

      APP_SEAT_PRICE: ${APP_SEAT_PRICE:-79.00}
      APP_INVITE_EXPIRATION_HOURS: ${APP_INVITE_EXPIRATION_HOURS:-72}

      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: escapa
      MINIO_ROOT_PASSWORD: escapa12345
      MINIO_BUCKET: escapa-media

      # Padrao: Mailpit em modo de teste. Para envio real em dev, sobrescreva no .env
      # (ver README). APP_MAIL_TEST_MODE fica true fora de producao.
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mailpit}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      APP_MAIL_AUTH: ${APP_MAIL_AUTH:-false}
      APP_MAIL_STARTTLS: ${APP_MAIL_STARTTLS:-false}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-nao-responda@escapa.com.br}
      APP_MAIL_TEST_MODE: ${APP_MAIL_TEST_MODE:-true}
      APP_MAIL_TEST_REDIRECT_TO: ${APP_MAIL_TEST_REDIRECT_TO:-}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:3000}

    ports:
      - "8080:8080"


volumes:
  postgres_data:
  minio_data: