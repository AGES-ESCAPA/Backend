version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: escapadb
    restart: unless-stopped
    environment:
      POSTGRES_DB: escapa_db
      POSTGRES_USER: escapa
      POSTGRES_PASSWORD: escapa123
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: escapabackend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/escapa_db
      SPRING_DATASOURCE_USERNAME: escapa
      SPRING_DATASOURCE_PASSWORD: escapa123
      SERVER_PORT: 8080
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - '8080:8080'

volumes:
  postgres_data:
