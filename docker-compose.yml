services:
  postgres:
    image: postgres:16-alpine
    container_name: escapadb
    restart: unless-stopped
    environment:
      POSTGRES_DB: escapa_db
      POSTGRES_USER: escapa
      POSTGRES_PASSWORD: escapa123
    # Porta exposta para a maquina do dev. 15432 por padrao para nao colidir com
    # PostgreSQL instalado no sistema (os instaladores usam 5432, 5433, 5434...). Dentro da rede do
    # Compose o banco continua em postgres:5432. Sobrescreva com POSTGRES_HOST_PORT
    # no .env (o Compose le esse arquivo sozinho).
    ports:
      - '${POSTGRES_HOST_PORT:-15432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U escapa -d escapa_db']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: escapabackend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/escapa_db
      SPRING_DATASOURCE_USERNAME: escapa
      SPRING_DATASOURCE_PASSWORD: escapa123
      SERVER_PORT: 8080
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/seed
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
    # Porta exposta para a maquina do dev. Sobrescreva com BACKEND_HOST_PORT no .env
    # se a 8080 estiver ocupada (ex.: um Vite de outro projeto). Dentro do container
    # a aplicacao continua na 8080.
    ports:
      - '${BACKEND_HOST_PORT:-8080}:8080'

volumes:
  postgres_data:
