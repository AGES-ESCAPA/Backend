name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build, checkstyle and test
        run: mvn -B clean verify

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        with:
          name: Test Results
          path: target/surefire-reports/*.xml
          reporter: java-junit
          # A build that fails before the tests run leaves no reports behind;
          # that is already reported by the build step, not a failure of this one.
          fail-on-empty: 'false'
          # Publishes a "Test Results" check run, which branch protection requires.
          # Left at the default, this action only writes the job summary and the
          # required check stays pending forever.
          use-actions-summary: 'false'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/ages-escapa/escapa-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_NAME }}:stable
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-gitops:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout gitops repo
        uses: actions/checkout@v4
        with:
          repository: AGES-ESCAPA/gitos-escapa
          token: ${{ secrets.GITOPS_PAT }}

      - name: Set backend image tag to this commit's sha
        run: |
          sed -i "s#image: ghcr.io/ages-escapa/escapa-backend:.*#image: ghcr.io/ages-escapa/escapa-backend:${{ github.sha }}#" \
            apps/escapa/backend/deployment.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/escapa/backend/deployment.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(backend): deploy ${{ github.sha }}"
          git push
