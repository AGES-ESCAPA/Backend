name: Mirror to GitLab AGES Escapa Backend

on:
  push:
    branches:
      - main
      - develop

jobs:
  git-mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Escapa GitLab
        run: |
          git remote add gitlab https://${{ secrets.GITLAB_USERNAME }}:${{ secrets.GITLAB_TOKEN }}@tools.ages.pucrs.br/2026-2/2jk-4jk/escapa/backend.git

          git push gitlab HEAD:refs/heads/${{ github.ref_name }} --force
