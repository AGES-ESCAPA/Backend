<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{{titulo}}</title>
  <!--[if mso]>
  <style type="text/css">
    body, table, td { font-family: Arial, Helvetica, sans-serif !important; }
  </style>
  <![endif]-->
</head>
<body style="margin:0;padding:0;background-color:#0c0c1a;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
  <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;">
    {{preheader}}
  </div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#0c0c1a;margin:0;padding:0;width:100%;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;width:100%;">

          <!-- Cabeçalho: escapa! | Academy (lockup horizontal) -->
          <tr>
            <td align="center" style="padding:0 0 24px 0;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 auto;">
                <tr>
                  <td align="right" valign="middle" style="padding:0 16px 0 0;">
                    <img src="cid:escapa-logo" width="140" height="auto" alt="escapa!" style="display:block;border:0;outline:none;text-decoration:none;height:auto;max-width:140px;">
                  </td>
                  <td valign="middle" width="1" style="padding:0;width:1px;background-color:#a5adb6;font-size:0;line-height:0;">
                    <div style="width:1px;height:36px;line-height:36px;font-size:0;">&nbsp;</div>
                  </td>
                  <td align="left" valign="middle" style="padding:0 0 0 16px;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,Helvetica,sans-serif;">
                    <div style="font-size:15px;line-height:1.2;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:#e3e6e8;">
                      Academy
                    </div>
                    <div style="margin-top:4px;font-size:11px;line-height:1.3;font-weight:400;color:#c7ccd1;white-space:nowrap;">
                      Da Pesquisa à Prática
                    </div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Cartão de conteúdo -->
          <tr>
            <td style="background-color:#ffffff;border-radius:12px;overflow:hidden;">
              <!-- Faixa de destaque (info / cyan da marca) -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="height:4px;line-height:4px;font-size:0;background-color:#5be5ff;">&nbsp;</td>
                </tr>
              </table>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="padding:32px 28px 28px 28px;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5;color:#2e3338;">
                    {{conteudo}}
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Rodapé -->
          <tr>
            <td align="center" style="padding:28px 12px 8px 12px;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,Helvetica,sans-serif;font-size:13px;line-height:1.5;color:#848f9a;">
              <p style="margin:0 0 8px 0;color:#c7ccd1;">Equipe Escapa!</p>
              <p style="margin:0;color:#65707b;font-size:12px;">
                Esta mensagem foi enviada automaticamente. Não responda a este e-mail.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
