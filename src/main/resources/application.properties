spring.application.name=escapa-backend
server.port=${SERVER_PORT:8080}

# A URL padrao aponta para o container do docker-compose.yml na porta POSTGRES_HOST_PORT
# (15432). Quem tem banco em outro lugar sobrescreve SPRING_DATASOURCE_URL inteira.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_HOST_PORT:15432}/escapa_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:escapa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:escapa123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.locations=${SPRING_FLYWAY_LOCATIONS:classpath:db/migration}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Fallback de porta: se server.port estiver ocupada, tenta as candidatas em ordem.
# Desligado por padrao (homologacao/producao: porta fixa). O perfil dev liga.
app.server.port-fallback.enabled=${APP_SERVER_PORT_FALLBACK_ENABLED:false}
app.server.port-fallback.candidates=${APP_SERVER_PORT_FALLBACK_CANDIDATES:8081,8082,8083}
