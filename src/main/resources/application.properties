spring.application.name=escapa-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/escapa_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:escapa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:escapa123}
spring.datasource.driver-class-name=org.postgresql.Driver
# Fuso unico do sistema (ver EscapaBackendApplication.TIME_ZONE): a sessao do banco usa o mesmo fuso do
# Java, para CURRENT_DATE/now() concordarem com LocalDate.now()/LocalDateTime.now().
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'America/Sao_Paulo'

spring.flyway.locations=${SPRING_FLYWAY_LOCATIONS:classpath:db/migration}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

app.jwt.secret=${APP_JWT_SECRET:escapa-jwt-secret-key-development-minimum-256-bits-length}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:60}

# Valor de cada assento corporativo (US-27). Nenhuma US define o modelo comercial do pacote de licenças.
app.seat-price=${APP_SEAT_PRICE:79.00}

# Validade do convite de colaborador para criar a senha (US-31), em horas.
app.invite.expiration-hours=${APP_INVITE_EXPIRATION_HOURS:72}

# Envio de e-mail (US-31). O padrao aponta para o Mailpit local, que nao usa autenticacao
# nem TLS. Para um SMTP real, defina usuario e senha e ligue APP_MAIL_AUTH e APP_MAIL_STARTTLS.
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${APP_MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${APP_MAIL_STARTTLS:false}
app.mail.from=${APP_MAIL_FROM:nao-responda@escapa.com.br}
# Marca o e-mail como teste: [TESTE] no assunto e aviso no topo do corpo. Deve ser false em
# producao, senao os usuarios reais recebem os e-mails marcados como teste.
app.mail.test-mode=${APP_MAIL_TEST_MODE:false}
# So no modo de teste: se preenchido, todos os e-mails vao para este endereco, e nao para o
# destinatario original. Evita enviar e-mail real para os usuarios do seed.
app.mail.test-redirect-to=${APP_MAIL_TEST_REDIRECT_TO:}
# Endereco do frontend, usado para montar os links dos e-mails (ex.: criar senha do convite).
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
# O Actuator verificaria o SMTP no /actuator/health: com o servidor de e-mail fora, a
# aplicacao inteira apareceria DOWN. Falha de envio e tratada por quem envia.
management.health.mail.enabled=false

app.storage.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.storage.minio.access-key=${MINIO_ROOT_USER:escapa}
app.storage.minio.secret-key=${MINIO_ROOT_PASSWORD:escapa12345}
app.storage.minio.bucket=${MINIO_BUCKET:escapa-media}
app.storage.minio.public-base-url=${MINIO_PUBLIC_BASE_URL:http://localhost:9000}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# PDF do certificado (US-19). Incrementar certificate.template.version sempre que o
# template visual mudar: a versao faz parte da chave do cache, e os PDFs antigos
# deixam de ser servidos. certificate.default-theme vale quando o ?theme= nao vem.
certificate.template.version=${CERTIFICATE_TEMPLATE_VERSION:v2}
certificate.default-theme=${CERTIFICATE_DEFAULT_THEME:dark}
certificate.pdf.timeout-seconds=${CERTIFICATE_PDF_TIMEOUT_SECONDS:30}
certificate.pdf.queue-capacity=${CERTIFICATE_PDF_QUEUE_CAPACITY:20}
# Sobe o Chromium logo apos o startup: a primeira subida no container passa do prazo
# de uma requisicao. Desligado, o navegador so sobe (e ocupa memoria) no primeiro download.
certificate.pdf.warm-up=${CERTIFICATE_PDF_WARM_UP:true}

# Metricas para o Prometheus (Grafana). O Actuator responde em uma porta separada,
# que fica so dentro do cluster: a 8081 nao entra no Service publicado pelo Ingress,
# entao /actuator/prometheus nao e acessivel pela internet.
management.server.port=${MANAGEMENT_SERVER_PORT:8081}
management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}
# Histograma de latencia das requisicoes HTTP, para calcular p50/p95/p99 no Prometheus.
# Os limites cortam os buckets fora da faixa util e mantem o numero de series baixo.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.minimum-expected-value.http.server.requests=5ms
management.metrics.distribution.maximum-expected-value.http.server.requests=30s
