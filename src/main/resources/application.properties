spring.application.name=escapa-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/escapa_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:escapa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:escapa123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.locations=${SPRING_FLYWAY_LOCATIONS:classpath:db/migration}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.storage.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.storage.minio.access-key=${MINIO_ROOT_USER:escapa}
app.storage.minio.secret-key=${MINIO_ROOT_PASSWORD:escapa12345}
app.storage.minio.bucket=${MINIO_BUCKET:escapa-media}
app.storage.minio.public-base-url=${MINIO_PUBLIC_BASE_URL:http://localhost:9000}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# PDF do certificado (US-19). Incrementar certificate.template.version sempre que o
# template visual mudar: a versao faz parte da chave do cache, e os PDFs antigos
# deixam de ser servidos. certificate.default-theme vale quando o ?theme= nao vem.
certificate.template.version=${CERTIFICATE_TEMPLATE_VERSION:v2}
certificate.default-theme=${CERTIFICATE_DEFAULT_THEME:dark}
certificate.pdf.timeout-seconds=${CERTIFICATE_PDF_TIMEOUT_SECONDS:30}
certificate.pdf.queue-capacity=${CERTIFICATE_PDF_QUEUE_CAPACITY:20}
# Sobe o Chromium logo apos o startup: a primeira subida no container passa do prazo
# de uma requisicao. Desligado, o navegador so sobe (e ocupa memoria) no primeiro download.
certificate.pdf.warm-up=${CERTIFICATE_PDF_WARM_UP:true}
