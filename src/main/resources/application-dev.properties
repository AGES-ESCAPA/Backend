# Perfil de desenvolvimento local.
#
# Ativado por padrao em `mvn spring-boot:run` (ver spring-boot.run.profiles no
# pom.xml). O jar empacotado, os testes e os ambientes de homologacao/producao
# nao usam este perfil, entao o seed nunca chega neles.
#
# Para rodar pelo Maven sem o seed: mvn spring-boot:run -Dspring-boot.run.profiles=default

# Aplica o seed de desenvolvimento (db/seed/R__seed_dev.sql) depois das
# migrations. A variavel de ambiente continua tendo prioridade, se definida.
spring.flyway.locations=${SPRING_FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/seed}
